<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lenon</title>

        <!-------------------------------------------------->
        <!-- Biblioteca Jimp para processamento de imagens-->

        <script src="https://cdn.jsdelivr.net/npm/jimp@0.22.12/browser/lib/jimp.js"></script>

        <!-- ----------------------------------------------->
         <link rel="stylesheet" href="styles.css">

    <base target="_blank">
</head>
    <body>



        <!---------------- Barra superior ------------------>
        <!-- contém os botões de escolher imagem e salvar -->
        <header>
            <h1>Lenon</h1>
            <div id="top-area">
                <input type="file" id="img-input" accept="image/*">
                <label class="file-btn" for="img-input">Escolher imagem</label>
                <button class="action-btn" id="save-btn" disabled>Salvar</button>
            </div>
        </header>



        <!------------------ Barra lateral esquerda ------------------>
        <!------------- contém ferramentas que não utilizam filtros -->

        <aside class="sidebar" id="tools">
                <div class="panel-title">FERRAMENTAS</div>
                <div class="tool-item">Selecionar</div>
                <div class="tool-item">Cortar</div>
                <div class="tool-item">Desenhar</div>
                <div class="tool-item tool-item-btn tool-item-disabled" id="tool-scale">Escala</div>
                <div class="tool-item tool-item-btn tool-item-disabled" id="tool-rotate">Rotação</div>
        </aside>
        


        <!-- Barra lateral direita-->
        <!-- contém as diversas opções de filtros e processamento de imagem-->

        <aside class="sidebar" id="filters">
            <div id="filters-items">
                <div class="panel-title">FILTROS</div>
                <button class="filter-btn" id="negative" disabled>Negativo</button>
                <button class="filter-btn" id="threshold"disabled>Limiarização</button>
                <button class="filter-btn" id="brightness" disabled>Brilho</button>
                <button class="filter-btn" id="gama" disabled>Correção de gama</button>
                <button class="filter-btn" id="linear-func" disabled>Linear</button>
                <button class="filter-btn" id="histogram" disabled>Histograma</button>
                <button class="filter-btn" id="histogram-eq" disabled>Equalização de histograma</button>
                <button class="filter-btn" id="esteganography" disabled>Esteganografia</button>
                <button class="filter-btn" id="smoothing" disabled>Suavização (Média/Gaussiano)</button>
                <button class="filter-btn" id="median" disabled>Filtragem pela mediana</button>
                <button class="filter-btn" id="laplacian-sharpen" disabled>Aguçamento Laplaciano</button>
                <button class="filter-btn" id="high-boost" disabled>Aguçamento High-Boost</button>
                <button class="filter-btn" id="sobel" disabled>Sobel (X / Y)</button>
                <button class="filter-btn" id="sobel-magnitude" disabled>Detecção de bordas (gradiente)</button>
                <button class="filter-btn" id="convolution" disabled>Convolução</button>
            </div>
            <div class="section-gap"></div>

            <div class="panel-title">CAMADAS</div>
            <div class="layers">
                <div id="layers-list"></div>
                <div class="layers-empty">Nenhum filtro aplicado</div>
            </div>
        </aside>



        <!--------------------- Área da imagem ---------------------->

        <section id="canvas-area">
            <div id="empty-canvas">
                Nenhuma imagem carregada
            </div>

            <div id="canvas">
                <img id="main-img" alt="imagem">
            </div>
        </section>



        <script src="script.js"></script>
    </body>
</html>>
